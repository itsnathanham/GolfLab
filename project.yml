name: GolfLab

options:
  bundleIdPrefix: com.nathanhamilton
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "15.4"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"

targets:
  GolfLab:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GolfLab
        excludes:
          - Config/Secrets.local.xcconfig
      - path: Shared
    resources:
      - path: GolfLab/Assets.xcassets
      - path: GolfLab/Resources/Fonts/IBMPlexSans-Variable.ttf
      - path: GolfLab/Resources/Fonts/IBMPlexMono-Medium.ttf
      - path: GolfLab/Resources/Fonts/IBMPlexMono-SemiBold.ttf
    dependencies:
      - package: Supabase
        product: Supabase
      - target: "GolfLab Watch App"
        embed: true
    configFiles:
      Debug: GolfLab/Config/GolfLabSecrets.xcconfig
      Release: GolfLab/Config/GolfLabSecrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nathanhamilton.golflab
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: ""
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: GolfLab/App/Info.plist
    entitlements:
      path: GolfLab/GolfLab.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default

  GolfLab Watch App:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: GolfLabWatch
      - path: Shared
    resources:
      - path: GolfLabWatch/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nathanhamilton.golflab.watch
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: ""
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: GolfLabWatch/App/Info.plist
