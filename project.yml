name: GolfLab

options:
  bundleIdPrefix: com.nathanhamilton
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "15.4"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: LVN484T28R

targets:
  GolfLab:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GolfLab
      - path: Shared
        excludes:
          - GLVsParLabel.swift
    resources:
      - path: GolfLab/Assets.xcassets
      - path: GolfLab/Resources/Fonts/IBMPlexSans-Variable.ttf
      - path: GolfLab/Resources/Fonts/IBMPlexMono-Medium.ttf
      - path: GolfLab/Resources/Fonts/IBMPlexMono-SemiBold.ttf
    dependencies:
      - target: "GolfLab Watch App"
        embed: true
      - target: GolfLabWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nathanhamilton.golflab
        DEVELOPMENT_TEAM: LVN484T28R
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "3"
        INFOPLIST_FILE: GolfLab/App/Info.plist
    entitlements:
      path: GolfLab/GolfLab.entitlements
      properties:
        aps-environment: development
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.nathanhamilton.golflab
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.nathanhamilton.golflab

  GolfLab Watch App:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: GolfLabWatch
      - path: Shared
        excludes:
          - RoundLiveActivityAttributes.swift
          - GLVsParLabel.swift
    resources:
      - path: GolfLabWatch/Assets.xcassets
    dependencies:
      - target: GolfLabWatchComplications
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nathanhamilton.golflab.watch
        DEVELOPMENT_TEAM: LVN484T28R
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "3"
        INFOPLIST_FILE: GolfLabWatch/App/Info.plist
    entitlements:
      path: GolfLabWatch/GolfLabWatch.entitlements

  GolfLabWatchComplications:
    type: app-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: GolfLabWatchComplications
      - path: GolfLabWatch/Views/GLComplicationIcon.swift
      - path: GolfLabWatch/Design/WatchPalette.swift
      - path: Shared/WatchComplicationStore.swift
      - path: Shared/GLVsParLabel.swift
      - path: Shared/RoundLiveActivityAttributes.swift
      - path: Shared/RoundLiveActivityBanner.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nathanhamilton.golflab.watch.widget
        DEVELOPMENT_TEAM: LVN484T28R
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "3"
        INFOPLIST_FILE: GolfLabWatchComplications/Info.plist
        CODE_SIGN_ENTITLEMENTS: GolfLabWatch/GolfLabWatch.entitlements
        SKIP_INSTALL: YES

  GolfLabWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GolfLabWidgets
      - path: Shared/RoundLiveActivityAttributes.swift
      - path: Shared/GLVsParLabel.swift
      - path: Shared/RoundLiveActivityBanner.swift
      - path: GolfLab/DesignSystem/Colors.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nathanhamilton.golflab.widgets
        DEVELOPMENT_TEAM: LVN484T28R
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "3"
        INFOPLIST_FILE: GolfLabWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: GolfLabWidgets/GolfLabWidgets.entitlements
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
