name: GolfLab

options:
  bundleIdPrefix: com.nathanhamilton
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "15.4"
  createIntermediateGroups: true
  groupSortPosition: top

targets:
  GolfLab:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GolfLab
      - path: Shared
    resources:
      - path: GolfLab/Assets.xcassets
      - path: GolfLab/Resources/Fonts/IBMPlexSans-Variable.ttf
      - path: GolfLab/Resources/Fonts/IBMPlexMono-Medium.ttf
      - path: GolfLab/Resources/Fonts/IBMPlexMono-SemiBold.ttf
    dependencies:
      - target: "GolfLab Watch App"
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nathanhamilton.golflab
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: ""
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "3"
        INFOPLIST_FILE: GolfLab/App/Info.plist
    entitlements:
      path: GolfLab/GolfLab.entitlements
      properties:
        aps-environment: development
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.nathanhamilton.golflab
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.nathanhamilton.golflab

  GolfLab Watch App:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: GolfLabWatch
      - path: Shared
    resources:
      - path: GolfLabWatch/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nathanhamilton.golflab.watch
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: ""
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "3"
        INFOPLIST_FILE: GolfLabWatch/App/Info.plist
